<text class="k" x="96" y="72"><tspan fill="#ff9900">[</tspan>PREGUNTA 1 · MEMORIA<tspan fill="#ff9900">]</tspan></text>
<text class="big" x="96" y="160" font-size="38" font-weight="500">Tu app tiene un carrito de compras. Casi todo el día el tráfico es bajo,</text><text class="big" x="96" y="216" font-size="38" font-weight="500">pero cuando un influencer publica la app, las solicitudes se multiplican</text><text class="big" x="96" y="272" font-size="38" font-weight="500">en minutos. El equipo es pequeño y no quiere planificar capacidad</text><text class="big" x="96" y="328" font-size="38" font-weight="500">ni administrar servidores de base de datos.</text>
